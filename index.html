<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Get Vehicle Details</title>
        <link rel="stylesheet" href="./css/styles.css">
    </head>

    <body>
        <header>
            <h1>Get Vehicle Details</h1>
        </header>

        <main>
            <section>
                <div>
                    <p>Enter a Vehicle Identification Number (VIN). We'll check the National Highway Trafic Safety
                        Administion for vehicle details.</p>

                </div>
                <div class="inputs">
                    <label for="vehicleVIN">VIN Search:</label>
                    <input type="text" name="vehicleVin" id="vehicleVIN" maxlength="17">
                    <button id="getVehicleDetails">Get Vihicle Details</button>
                </div>
            </section>

            <section>
                <h2>Vehicle Details</h2>
                <div id="vehicleDetails"></div>
            </section>
        </main>

        <footer>
            <small>Made by: Niles</small>
        </footer>

        <script type="text/javascript" src="./js/main.js"></script>
    </body>

</html>
